services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: collab_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collab_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - collab-postgres:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: ecto://postgres:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/collab_dev
      PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  collab-postgres:
