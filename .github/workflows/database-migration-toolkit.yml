name: Database migration toolkit

on:
  push:
    paths:
      - "database-migration-toolkit/**"
      - ".github/workflows/database-migration-toolkit.yml"
  pull_request:
    paths:
      - "database-migration-toolkit/**"
      - ".github/workflows/database-migration-toolkit.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database-migration-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle test
      - run: gradle run --args=validate
