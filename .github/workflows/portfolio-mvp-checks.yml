name: Portfolio MVP checks

on:
  workflow_dispatch:
  push:
    paths:
      - "personal-finance-android/**"
      - "network-monitoring-suite/**"
      - ".github/workflows/portfolio-mvp-checks.yml"
  pull_request:
    paths:
      - "personal-finance-android/**"
      - "network-monitoring-suite/**"
      - ".github/workflows/portfolio-mvp-checks.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle -p personal-finance-android testDebugUnitTest assembleDebug

  network-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: network-monitoring-suite/go.mod
      - run: go test -race ./...
        working-directory: network-monitoring-suite
      - run: go vet ./...
        working-directory: network-monitoring-suite
      - run: go build -o network-monitor .
        working-directory: network-monitoring-suite
      - run: make test-c
        working-directory: network-monitoring-suite
