name: Encrypted Password Manager
on:
  workflow_dispatch:
  push:
    paths: ['encrypted-password-manager/**', '.github/workflows/encrypted-password-manager.yml']
  pull_request:
    paths: ['encrypted-password-manager/**', '.github/workflows/encrypted-password-manager.yml']
jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: encrypted-password-manager
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
