name: Cloud file storage and sync

on:
  workflow_dispatch:
  push:
    paths:
      - "cloud-file-sync/**"
      - ".github/workflows/cloud-file-sync.yml"
  pull_request:
    paths:
      - "cloud-file-sync/**"
      - ".github/workflows/cloud-file-sync.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-file-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-file-sync-test-results
          path: cloud-file-sync/build/test-results/test/
          if-no-files-found: warn
