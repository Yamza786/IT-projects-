name: SME Manager container

on:
  push:
    branches: [integration/fastapi, main]
    paths:
      - 'sme-manager/**'
      - 'devops-demo/**'
      - 'requirements-termux.txt'
      - '.github/workflows/sme-container.yml'
  pull_request:
    paths:
      - 'sme-manager/**'
      - 'devops-demo/**'
      - 'requirements-termux.txt'
      - '.github/workflows/sme-container.yml'

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -f devops-demo/Dockerfile -t polymath-sme:ci .
      - name: Start container
        run: docker run -d --name sme -p 8000:8000 -v sme-ci-data:/data polymath-sme:ci
      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs sme
          exit 1
      - name: Stop container
        if: always()
        run: docker rm --force sme || true
