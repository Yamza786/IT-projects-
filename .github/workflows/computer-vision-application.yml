name: Computer vision application

on:
  workflow_dispatch:
  push:
    paths:
      - "computer-vision-application/**"
      - ".github/workflows/computer-vision-application.yml"
  pull_request:
    paths:
      - "computer-vision-application/**"
      - ".github/workflows/computer-vision-application.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libopencv-dev
      - name: Configure
        run: cmake -S computer-vision-application -B build/image-inspector -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/image-inspector --parallel 2
      - name: Test
        run: ctest --test-dir build/image-inspector --output-on-failure
