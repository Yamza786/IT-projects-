name: E-commerce marketplace checks

on:
  workflow_dispatch:
  push:
    paths:
      - "ecommerce-marketplace/**"
      - ".github/workflows/ecommerce-marketplace.yml"
  pull_request:
    paths:
      - "ecommerce-marketplace/**"
      - ".github/workflows/ecommerce-marketplace.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ecommerce-marketplace/package-lock.json
      - name: Install, inspect and test
        working-directory: ecommerce-marketplace
        run: |
          npm ci
          npm run typecheck
          npm test
          npm audit --audit-level=high
      - name: Build production image
        run: docker build -t ecommerce-marketplace:ci ecommerce-marketplace
