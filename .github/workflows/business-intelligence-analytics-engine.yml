name: Business Intelligence Analytics Engine
on:
  push:
    paths: ['business-intelligence-analytics-engine/**', '.github/workflows/business-intelligence-analytics-engine.yml']
  pull_request:
    paths: ['business-intelligence-analytics-engine/**', '.github/workflows/business-intelligence-analytics-engine.yml']
jobs:
  r-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-intelligence-analytics-engine
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
      - run: Rscript -e 'install.packages(c("DBI", "RSQLite", "testthat"), repos="https://cloud.r-project.org")'
      - run: Rscript tests/testthat.R
      - run: Rscript scripts/bi.R init --db build/ci.sqlite
      - run: Rscript scripts/bi.R import --db build/ci.sqlite --csv fixtures/transactions.synthetic.csv
      - run: Rscript scripts/bi.R report --db build/ci.sqlite --month 2026-01
