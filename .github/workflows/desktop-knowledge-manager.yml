name: Desktop knowledge manager

on:
  push:
    paths:
      - "desktop-knowledge-manager/**"
      - ".github/workflows/desktop-knowledge-manager.yml"
  pull_request:
    paths:
      - "desktop-knowledge-manager/**"
      - ".github/workflows/desktop-knowledge-manager.yml"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-knowledge-manager
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgtk-3-dev
      - run: dart format .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-knowledge-manager
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
