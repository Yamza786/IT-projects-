name: Enterprise SaaS Management

on:
  workflow_dispatch:
  push:
    paths:
      - "enterprise-saas-management/**"
      - ".github/workflows/saas-management.yml"
  pull_request:
    paths:
      - "enterprise-saas-management/**"
      - ".github/workflows/saas-management.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-saas-management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: enterprise-saas-management/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
