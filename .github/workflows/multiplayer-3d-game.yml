name: Unity multiplayer verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editmode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: multiplayer-3d-game
          unityVersion: 6000.0.0f1
          testMode: editmode
          artifactsPath: artifacts/editmode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-editmode-results
          path: artifacts/editmode

  linux-player:
    needs: editmode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: multiplayer-3d-game
          unityVersion: 6000.0.0f1
          targetPlatform: StandaloneLinux64
          buildName: RelayArena
          buildsPath: multiplayer-3d-game/build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-arena-linux-player
          path: multiplayer-3d-game/build
