name: Polymath Enterprise container

on:
  push:
    branches: [integration/fastapi, main]
  pull_request:

jobs:
  portfolio-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portfolio dependencies
        run: python -m pip install -r requirements-termux.txt
      - name: Run portfolio workflows
        run: python -m pytest tests -q
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate hardened Compose configuration
        run: |
          cp devops-demo/.env.production.example devops-demo/.env.production
          docker compose -f devops-demo/compose.yaml config --quiet
          rm devops-demo/.env.production
      - name: Build container
        run: docker build -f devops-demo/Dockerfile -t polymath-enterprise:ci .
      - name: Start container
        run: docker run -d --name enterprise -p 10000:10000 -v enterprise-ci-data:/data polymath-enterprise:ci
      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/health; then exit 0; fi
            sleep 2
          done
            docker logs enterprise
          exit 1
      - name: Stop container
        if: always()
        run: docker rm --force enterprise || true
