name: Mini SIEM checks

on:
  workflow_dispatch:
  push:
    paths:
      - "mini-siem-platform/**"
      - ".github/workflows/mini-siem.yml"
  pull_request:
    paths:
      - "mini-siem-platform/**"
      - ".github/workflows/mini-siem.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-siem-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: mini-siem-platform/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mini-siem-platform/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/siem ./cmd/siem
      - run: docker build -t mini-siem:ci .
      - name: Smoke test the container API
        run: |
          token="$(openssl rand -hex 32)"
          docker run -d --name mini-siem-smoke -p 127.0.0.1:18090:8090 -e SIEM_API_TOKEN="$token" -v mini-siem-smoke-data:/var/lib/siem mini-siem:ci
          trap 'docker rm -f mini-siem-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18090/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18090/api/v1/health >/dev/null
          ! curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18090/api/v1/events | grep -q '^200$'
          curl --fail --silent -H "Authorization: Bearer $token" http://127.0.0.1:18090/api/v1/events >/dev/null
