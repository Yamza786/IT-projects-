name: Mini SIEM checks

on:
  workflow_dispatch:
  push:
    paths:
      - "mini-siem-platform/**"
      - ".github/workflows/mini-siem.yml"
  pull_request:
    paths:
      - "mini-siem-platform/**"
      - ".github/workflows/mini-siem.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-siem-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: mini-siem-platform/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mini-siem-platform/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/siem ./cmd/siem
      - run: docker build -t mini-siem:ci .
