name: API gateway and rate limiter

on:
  push:
    paths:
      - "api-gateway-rate-limiter/**"
      - ".github/workflows/api-gateway-rate-limiter.yml"
  pull_request:
    paths:
      - "api-gateway-rate-limiter/**"
      - ".github/workflows/api-gateway-rate-limiter.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway-rate-limiter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle test
