name: Real-Time Collaboration Platform
on:
  push:
    paths: ['realtime-collaboration-platform/**', '.github/workflows/realtime-collaboration-platform.yml']
  pull_request:
    paths: ['realtime-collaboration-platform/**', '.github/workflows/realtime-collaboration-platform.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d collab_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: realtime-collaboration-platform
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17.3'
          otp-version: '27.2'
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix ecto.create && mix ecto.migrate && mix test
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/collab_test
