name: iOS Study Planner
on:
  workflow_dispatch:
  push:
    paths: ['ios-study-planner/**', '.github/workflows/ios-study-planner.yml']
  pull_request:
    paths: ['ios-study-planner/**', '.github/workflows/ios-study-planner.yml']
jobs:
  swift:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios-study-planner
    steps:
      - uses: actions/checkout@v4
      - run: swift test
