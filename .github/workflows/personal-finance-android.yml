name: Pocket Ledger Android checks

on:
  push:
    paths:
      - "personal-finance-android/**"
      - ".github/workflows/personal-finance-android.yml"
  pull_request:
    paths:
      - "personal-finance-android/**"
      - ".github/workflows/personal-finance-android.yml"

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: node --test personal-finance-android/tooling/migration-contract.test.mjs
      - run: gradle -p personal-finance-android testDebugUnitTest assembleDebug

  room-instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle -p personal-finance-android connectedDebugAndroidTest
