name: Python CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
      - name: Run ruff
        run: |
          ruff algorithms-python || true
      - name: Run tests
        run: |
          if [ -d "algorithms-python/tests" ]; then pytest algorithms-python/tests -q; else echo "No tests to run"; fi
