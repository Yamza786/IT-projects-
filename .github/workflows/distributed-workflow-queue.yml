name: Distributed workflow queue
on:
  push:
    paths: ['distributed-workflow-queue/**', '.github/workflows/distributed-workflow-queue.yml']
  pull_request:
    paths: ['distributed-workflow-queue/**', '.github/workflows/distributed-workflow-queue.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - run: sbt test
        working-directory: distributed-workflow-queue
