name: Validate docker-compose

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: python -m pip install --upgrade pip yamllint
      - name: Lint docker-compose.yml
        run: |
          if [ -f "vuln-web-lab/docker-compose.yml" ]; then yamllint -d relaxed vuln-web-lab/docker-compose.yml; else echo "No docker-compose.yml found"; fi
